<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="880" height="240" fill="#0f172a" rx="14"/>

  <text x="440" y="34" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">sealed-inbox — how a record travels</text>

  <g font-family="DejaVu Sans, sans-serif">
    <!-- browser -->
    <rect x="30" y="70" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="115" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">browser form</text>
    <text x="115" y="122" text-anchor="middle" font-size="11" fill="#94a3b8">any device, no account</text>
    <text x="115" y="140" text-anchor="middle" font-size="11" fill="#7dd3fc">RSA-OAEP + AES-GCM</text>

    <!-- email -->
    <rect x="255" y="70" width="170" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="340" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">email server</text>
    <text x="340" y="122" text-anchor="middle" font-size="11" fill="#94a3b8">opaque envelope only</text>
    <text x="340" y="140" text-anchor="middle" font-size="11" fill="#f59e0b">sees no plaintext</text>

    <!-- receiver -->
    <rect x="480" y="70" width="200" height="90" rx="12" fill="url(#hero)" stroke="#3b82f6"/>
    <text x="580" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#f8fafc">sealed-inbox receiver</text>
    <text x="580" y="115" text-anchor="middle" font-size="11" fill="#93c5fd">IMAP IDLE → decrypt → dedupe</text>
    <text x="580" y="133" text-anchor="middle" font-size="11" fill="#93c5fd">your private key only</text>

    <!-- outputs -->
    <rect x="725" y="52" width="130" height="126" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="790" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">your server</text>
    <text x="790" y="100" text-anchor="middle" font-size="11" fill="#94a3b8">CSV · trend charts</text>
    <text x="790" y="118" text-anchor="middle" font-size="11" fill="#94a3b8">web dashboard</text>
    <text x="790" y="136" text-anchor="middle" font-size="11" fill="#94a3b8">Seafile archive</text>
    <text x="790" y="154" text-anchor="middle" font-size="11" fill="#94a3b8">Telegram ping</text>

    <line x1="200" y1="115" x2="250" y2="115" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="425" y1="115" x2="475" y2="115" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="680" y1="115" x2="720" y2="115" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

    <text x="225" y="105" text-anchor="middle" font-size="9.5" fill="#64748b">TLS</text>
    <text x="450" y="105" text-anchor="middle" font-size="9.5" fill="#64748b">IDLE</text>
    <text x="700" y="105" text-anchor="middle" font-size="9.5" fill="#64748b">append</text>

    <text x="115" y="196" text-anchor="middle" font-size="10.5" fill="#64748b">the sender needs only the public key</text>
    <text x="580" y="196" text-anchor="middle" font-size="10.5" fill="#64748b">the private key never leaves this host</text>
    <text x="440" y="222" text-anchor="middle" font-size="11" fill="#4ade80">e2e: RSA-OAEP-256 + AES-256-GCM — the mail provider stores only ciphertext</text>
  </g>
</svg>
